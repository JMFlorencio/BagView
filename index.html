<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BAGVIEW | AR Eco-Tourism</title>
    
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        :root { 
            --accent: #00ff88; 
            --scanning: #ffaa00; 
            --glass: rgba(0, 0, 0, 0.8); 
            --blur: blur(15px); 
        }

        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Segoe UI', Roboto, sans-serif; color: white; }

        /* AR Video Feed Fix */
        video { 
            position: fixed !important; top: 0 !important; left: 0 !important; 
            width: 100vw !important; height: 100vh !important;
            object-fit: cover !important; z-index: -5 !important; 
        }

        /* UI Layering */
        #ui-layer { position: fixed; inset: 0; z-index: 100; pointer-events: none; }
        .interactive { pointer-events: auto; }

        /* Screens */
        .overlay-screen { position: fixed; inset: 0; z-index: 2000; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.5s ease; }
        .hidden { opacity: 0; pointer-events: none; visibility: hidden; }

        /* Top Status Bar */
        .top-nav { position: absolute; top: 0; left: 0; right: 0; padding: 30px 20px; }
        .gps-display { 
            background: var(--glass); backdrop-filter: var(--blur); 
            padding: 12px 20px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.1);
            display: inline-flex; align-items: center; gap: 12px;
        }

        /* Status Pulses */
        .pulse { width: 10px; height: 10px; background: #444; border-radius: 50%; }
        .pulse.live { background: var(--scanning); animation: pulse-anim 1.5s infinite; }
        .pulse.match { background: var(--accent); transform: scale(1.2); }

        /* Bottom Dock & Gallery */
        .bottom-area { position: absolute; bottom: 0; left: 0; right: 0; }
        .bottom-dock { 
            background: linear-gradient(to top, rgba(0,0,0,1) 70%, transparent);
            transform: translateY(calc(100% - 60px));
            transition: 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            padding-bottom: 100px;
        }
        .bottom-dock.expanded { transform: translateY(0); }

        .scroll-container { 
            display: flex; gap: 15px; overflow-x: auto; padding: 20px; 
            scrollbar-width: none; width: 100%;
        }

        .station-card { 
            min-width: 110px; height: 140px; background: #111; border-radius: 12px; 
            overflow: hidden; border: 1px solid rgba(255,255,255,0.1); flex-shrink: 0; 
        }
        .station-card.active { border-color: var(--accent); box-shadow: 0 0 15px var(--accent); }

        /* Control Buttons */
        .nav-bar { position: absolute; bottom: 30px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 30px; }
        .cam-btn { 
            width: 70px; height: 70px; border-radius: 50%; background: #fff; 
            display: flex; align-items: center; justify-content: center; border: 4px solid #333;
        }
        .cam-btn.active { background: var(--accent); border-color: #fff; }

        @keyframes pulse-anim { 0% { box-shadow: 0 0 0 0 rgba(255, 170, 0, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(255, 170, 0, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 170, 0, 0); } }
    </style>
</head>
<body>

    <audio id="match-sound" src="https://cdn.pixabay.com/audio/2021/08/04/audio_bb630cc098.mp3" preload="auto"></audio>

    <div id="home-page" class="overlay-screen">
        <h1 style="letter-spacing:10px; font-weight:900;">BAG<span style="color:var(--accent)">VIEW</span></h1>
        <p style="font-size:10px; letter-spacing:4px; opacity:0.6;">ECO-TOURISM AUGMENTED</p>
        <button class="interactive" onclick="startExperience()" style="margin-top:50px; padding:15px 50px; border-radius:30px; border:none; background:var(--accent); font-weight:bold;">LAUNCH CAMERA</button>
    </div>

    <div id="ui-layer" class="hidden">
        <div class="top-nav">
            <div class="gps-display" id="status-container">
                <div class="pulse" id="status-pulse"></div>
                <span id="gps-status" style="font-size:12px; font-weight:bold; letter-spacing:1px;">STANDBY</span>
            </div>
        </div>

        <div class="bottom-area">
            <div class="bottom-dock interactive" id="gallery-hud">
                <div onclick="toggleDock()" style="height:40px; display:flex; justify-content:center; align-items:center;">
                    <div style="width:40px; height:4px; background:rgba(255,255,255,0.3); border-radius:2px;"></div>
                </div>
                <div class="scroll-container" id="gallery-root"></div>
            </div>

            <div class="nav-bar">
                <div class="cam-btn interactive" id="cam-toggle" onclick="toggleScanner()">
                    <svg viewBox="0 0 24 24" width="30" fill="black"><path d="M12 9c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3zm7-4h-2.69l-1.83-2H9.52l-1.83 2H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm-7 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
                </div>
            </div>
        </div>
    </div>

    <a-scene id="ar-scene" mindar-image="imageTargetSrc: targets.mind; autoStart: false; uiLoading: no; uiScanning: no;" embedded renderer="transparent: true; alpha: true;" vr-mode-ui="enabled: false">
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity id="target-container"></a-entity>
    </a-scene>

    <script>
        const stations = [
            { name: "Map", thumb: "Assets/A1_Map.jpg", link: "https://jmflorencio.github.io/BagView_Botanical_Map/" },
            { name: "Arbor", thumb: "Assets/Arbor.png", link: "https://tour.panoee.net/69b7b676cd5918466513b640" },
            { name: "Cactus", thumb: "Assets/Cactus&Succulents.png", link: "https://tour.panoee.net/69b7b991cd59184ead13b71f" }
            // Add other stations here as needed...
        ];

        function startExperience() {
            document.getElementById('home-page').classList.add('hidden');
            document.getElementById('ui-layer').classList.remove('hidden');
            buildUI();
            setupTracking();
        }

        function buildUI() {
            const root = document.getElementById('gallery-root');
            root.innerHTML = stations.map((s, i) => `
                <div class="station-card" id="card-${i}" onclick="window.open('${s.link}', '_blank')">
                    <img src="${s.thumb}" style="width:100%; height:70%; object-fit:cover;">
                    <div style="font-size:9px; text-align:center; padding:5px; font-weight:900;">${s.name}</div>
                </div>
            `).join('');
        }

        function setupTracking() {
            const container = document.getElementById('target-container');
            stations.forEach((s, i) => {
                const entity = document.createElement('a-entity');
                entity.setAttribute('mindar-image-target', `targetIndex: ${i}`);
                
                entity.addEventListener("targetFound", () => {
                    document.getElementById('match-sound').play();
                    updateStatus('match');
                    highlightCard(i);
                });

                entity.addEventListener("targetLost", () => updateStatus('scanning'));
                container.appendChild(entity);
            });
        }

        async function toggleScanner() {
            const sceneEl = document.querySelector('a-scene');
            const btn = document.getElementById('cam-toggle');
            
            if(!btn.classList.contains('active')) {
                await sceneEl.systems['mindar-image-system'].start();
                btn.classList.add('active');
                updateStatus('scanning');
            } else {
                sceneEl.systems['mindar-image-system'].stop();
                btn.classList.remove('active');
                updateStatus('standby');
            }
        }

        function updateStatus(state) {
            const pulse = document.getElementById('status-pulse');
            const text = document.getElementById('gps-status');
            pulse.className = 'pulse ' + (state === 'scanning' ? 'live' : state === 'match' ? 'match' : '');
            text.innerText = state.toUpperCase();
            text.style.color = state === 'match' ? 'var(--accent)' : state === 'scanning' ? 'var(--scanning)' : '#fff';
        }

        function highlightCard(index) {
            document.querySelectorAll('.station-card').forEach(c => c.classList.remove('active'));
            const activeCard = document.getElementById(`card-${index}`);
            activeCard.classList.add('active');
            activeCard.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            document.getElementById('gallery-hud').classList.add('expanded');
        }

        function toggleDock() {
            document.getElementById('gallery-hud').classList.toggle('expanded');
        }
    </script>
</body>
</html>
