<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BAGVIEW | AR Eco-Tourism</title>
    
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        :root { 
            --accent: #00A699; 
            --scanning: #00A699; 
            --glass: rgba(255, 255, 255, 0.9); 
            --blur: blur(20px); 
            --bg-page: #F2F5F7;
            --text-main: #333333;
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #ffffff; font-family: 'Segoe UI', sans-serif; color: var(--text-main); }

        /* Fix for A-Frame Camera Feed */
        video { 
            position: fixed !important; 
            top: 0 !important; left: 0 !important; 
            width: 100vw !important; height: 100vh !important;
            object-fit: cover !important; 
            z-index: -5 !important; 
        }

        a-scene { background: none !important; }

        /* --- UI COMPONENTS --- */
        .overlay-screen { 
            position: fixed; inset: 0; z-index: 2000; 
            background: var(--bg-page); display: flex; 
            flex-direction: column; align-items: center; 
            justify-content: center; text-align: center; 
            transition: 0.8s ease; 
        }
        
        .main-card {
            width: 92%; height: 94%; background: white;
            border-radius: 35px; overflow: hidden;
            display: flex; flex-direction: column;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
        }

        .hero-container { position: relative; width: 100%; height: 60%; overflow: hidden; background: #eee; }
        .hero-scroll-wrapper {
            display: flex; width: 100%; height: 100%;
            overflow-x: auto; scroll-snap-type: x mandatory;
            scrollbar-width: none;
        }
        .hero-slide { min-width: 100%; height: 100%; position: relative; scroll-snap-align: start; }
        .hero-img { width: 100%; height: 100%; background-size: cover; background-position: center; }

        .hero-info-overlay {
            position: absolute; bottom: 60px; left: 25px; right: 25px;
            text-align: left; color: white; z-index: 5;
        }
        .hero-info-overlay h2 { margin: 8px 0; font-size: 24px; font-weight: 800; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
        
        .badge { background: var(--accent); color: white; padding: 4px 10px; border-radius: 6px; font-size: 10px; font-weight: 800; text-transform: uppercase; }

        .scroll-dots { position: absolute; bottom: 25px; width: 100%; display: flex; justify-content: center; gap: 8px; z-index: 10; }
        .dot { width: 6px; height: 6px; background: rgba(0,0,0,0.15); border-radius: 50%; transition: 0.3s; }
        .dot.active { width: 20px; background: var(--accent); border-radius: 10px; }

        .hero-text-area { flex: 1; padding: 20px 30px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
        .hero-title { font-size: 22px; font-weight: 900; color: #111; line-height: 1.2; margin-top: 10px; }
        
        .get-started-btn {
            width: 100%; max-width: 280px; height: 60px;
            background: var(--accent); color: white;
            border: none; border-radius: 50px;
            font-size: 17px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; position: relative;
        }

        /* --- ACTIVE AR UI --- */
        #ui-layer { position: fixed; inset: 0; z-index: 100; pointer-events: none; transition: 0.5s; }
        .hidden { opacity: 0; pointer-events: none; visibility: hidden; }
        
        .top-nav { position: absolute; top: 0; left: 0; right: 0; padding: 30px 20px; display: flex; justify-content: space-between; align-items: center; }
        .gps-display { background: var(--glass); backdrop-filter: var(--blur); padding: 10px 18px; border-radius: 12px; display: flex; align-items: center; gap: 10px; }
        .pulse { width: 8px; height: 8px; background: #bbb; border-radius: 50%; } 
        .pulse.live { background: var(--scanning); animation: pulse-scanning 1.5s infinite; }
        .pulse.match { background: var(--accent); animation: pulse-match 0.5s infinite alternate; }

        .bottom-dock { 
            position: absolute; bottom: 0; width: 100vw; 
            transform: translateY(calc(100% - 40px)); 
            z-index: 120; padding-bottom: 120px; 
            transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1); 
            background: white; 
            border-radius: 30px 30px 0 0;
        }
        .bottom-dock.expanded { transform: translateY(0); box-shadow: 0 -10px 30px rgba(0,0,0,0.1); }
        
        .scroll-container { display: flex; gap: 12px; overflow-x: auto; padding: 20px; width: 100%; pointer-events: auto; }
        
        .station-card { 
            min-width: 110px; height: 140px; background: #f9f9f9; 
            border-radius: 16px; overflow: hidden; border: 1px solid #eee; 
            flex-shrink: 0; transition: 0.3s; 
        }
        .found-glow { border: 3px solid var(--accent) !important; transform: scale(1.05); }

        .nav-bar { position: absolute; bottom: 70px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 25px; z-index: 150; }
        .icon-btn { width: 50px; height: 50px; border-radius: 50%; background: white; display: flex; align-items: center; justify-content: center; pointer-events: auto; }
        .cam-btn { width: 75px; height: 75px; border-radius: 50%; background: white; border: 4px solid #eee; display: flex; align-items: center; justify-content: center; pointer-events: auto; }
        .cam-btn.active { border-color: var(--accent); background: var(--accent); }

        #shutter { position: fixed; inset: 0; z-index: -1; background: white; transition: 0.5s; pointer-events: none; }
        @keyframes pulse-scanning { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(2.5); opacity: 0; } }
    </style>
</head>
<body>

    <audio id="match-sound" src="https://cdn.pixabay.com/audio/2021/08/04/audio_bb630cc098.mp3" preload="auto"></audio>

    <div id="home-page" class="overlay-screen">
        <div class="main-card">
            <div class="hero-container">
                <div class="hero-scroll-wrapper" id="hero-carousel">
                    <div class="hero-slide"><div class="hero-img" style="background-image: url('Assets/A2_Main Entrance.png');"></div></div>
                </div>
                <div class="hero-info-overlay">
                    <span class="badge">Featured</span>
                    <h2>Botanical Garden</h2>
                </div>
            </div>
            <div class="hero-text-area">
                <h1 class="hero-title">Discover Baguio<br>In Augmented Reality</h1>
                <button class="get-started-btn" onclick="startApp()">GET STARTED</button>
            </div>
        </div>
    </div>

    <div id="ui-layer" class="hidden">
        <div class="top-nav">
            <div class="gps-display">
                <div class="pulse live" id="status-pulse"></div>
                <div id="gps-status" style="font-size:11px; font-weight:900; color:#666;">SCANNING...</div>
            </div>
        </div>

        <div class="bottom-dock" id="gallery-hud">
            <div class="scroll-container" id="gallery-root"></div>
        </div>

        <div class="nav-bar">
            <div class="cam-btn active" id="cam-toggle"><svg viewBox="0 0 24 24" width="32" fill="white"><path d="M12 9c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3zm7-4h-2.69l-1.83-2H9.52l-1.83 2H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm-7 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg></div>
        </div>
    </div>

    <div id="shutter"></div>

    <a-scene 
        id="ar-scene" 
        mindar-image="imageTargetSrc: targets.mind; autoStart: false; uiLoading: no; uiScanning: no;" 
        embedded 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;" raycaster="far: 10000; objects: .clickable"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0" id="target0" data-id="0"></a-entity>
        <a-entity mindar-image-target="targetIndex: 1" id="target1" data-id="1"></a-entity>
        <a-entity mindar-image-target="targetIndex: 2" id="target2" data-id="2"></a-entity>
        <a-entity mindar-image-target="targetIndex: 3" id="target3" data-id="3"></a-entity>
        <a-entity mindar-image-target="targetIndex: 4" id="target4" data-id="4"></a-entity>
        <a-entity mindar-image-target="targetIndex: 5" id="target5" data-id="5"></a-entity>
        <a-entity mindar-image-target="targetIndex: 6" id="target6" data-id="6"></a-entity>
        <a-entity mindar-image-target="targetIndex: 7" id="target7" data-id="7"></a-entity>
        <a-entity mindar-image-target="targetIndex: 8" id="target8" data-id="8"></a-entity>
        <a-entity mindar-image-target="targetIndex: 9" id="target9" data-id="9"></a-entity>
        <a-entity mindar-image-target="targetIndex: 10" id="target10" data-id="10"></a-entity>
        <a-entity mindar-image-target="targetIndex: 11" id="target11" data-id="11"></a-entity>
        <a-entity mindar-image-target="targetIndex: 12" id="target12" data-id="12"></a-entity>
        <a-entity mindar-image-target="targetIndex: 13" id="target13" data-id="13"></a-entity>
        <a-entity mindar-image-target="targetIndex: 14" id="target14" data-id="14"></a-entity>
        <a-entity mindar-image-target="targetIndex: 15" id="target15" data-id="15"></a-entity>
    </a-scene>

<script>
    const stations = [
        { name: "Map", thumb: "Assets/A1_Map.jpg", link: "https://jmflorencio.github.io/BagView_Botanical_Map/" },
        { name: "Main Entrance", thumb: "Assets/A2_Main Entrance.png", link: "https://jmflorencio.github.io/BagView_Botanical_Map/" },
        { name: "Arbor", thumb: "Assets/Arbor.png", link: "https://tour.panoee.net/69b7b676cd5918466513b640" },
        { name: "Cactus & Succulents", thumb: "Assets/Cactus&Succulents.png", link: "https://tour.panoee.net/69b7b991cd59184ead13b71f" },
        { name: "Centennial Garden", thumb: "Assets/Centennial Garden.png", link: "https://tour.panoee.net/69b7b991cd59184ead13b71f" },
        { name: "Chinese Garden", thumb: "Assets/Chinese%20Garden.png", link: "https://tour.panoee.net/69b74a8ccd5918bff013a943" },
        { name: "Dahlia Garden", thumb: "Assets/Dahlia Garden.png", link: "https://tour.panoee.net/69b74a8ccd5918bff013a943" },
        { name: "Friendship Garden", thumb: "Assets/City%20of%20Vaughan%20Friendship%20Garden.png", link: "https://tour.panoee.net/69b7b820a3e4d78d0cc8db9e" },
        { name: "Cordillera Village", thumb: "Assets/Cordillera%20Village.png", link: "https://tour.panoee.net/69b7b964a3e4d75529c8dc1a" },
        { name: "Greenhouse", thumb: "Assets/Greenhouse.png", link: "https://tour.panoee.net/69b7b91fa3e4d7ebe6c8dbfe" },
        { name: "Japanese Garden", thumb: "Assets/Japanese%20Garden.png", link: "https://tour.panoee.net/69b7b63aa3e4d733edc8db51" },
        { name: "Japanese Tunnel", thumb: "Assets/Japanese%20Tunnel.png", link: "https://tour.panoee.net/69b7b616a3e4d72922c8db49" },
        { name: "Korea Garden", thumb: "Assets/Korea%20Garden.png", link: "https://tour.panoee.net/koreagarden/1" },
        { name: "Orchidarium", thumb: "Assets/Orchidarium.png", link: "https://tour.panoee.net/orchidarium/1" },
        { name: "Philippine-Thailand Friendship Garden", thumb: "Assets/Philippine-Thailand Frienship Garden.png", link: "https://tour.panoee.net/69b184dfa0e1d16f1a9e388d/69b187aba0e1d18afb9e38fb" },
        { name: "PMSEA Garden", thumb: "Assets/PMSEA%20Garden.png", link: "https://tour.panoee.net/69b7b586a3e4d741fdc8db26" }
    ];

    function buildUI() {
        const root = document.getElementById('gallery-root');
        root.innerHTML = stations.map((s, i) => `
            <div class="station-card" id="card-${i}">
                <img src="${s.thumb}" style="width:100%; height:75%; object-fit:cover;">
                <div style="font-size:8px; text-align:center; padding:5px; font-weight:bold;">${s.name}</div>
            </div>
        `).join('');
    }

    async function startApp() {
        document.getElementById('home-page').style.opacity = '0';
        setTimeout(() => document.getElementById('home-page').classList.add('hidden'), 800);
        document.getElementById('ui-layer').classList.remove('hidden');
        buildUI();

        const sceneEl = document.querySelector('a-scene');
        const arSystem = sceneEl.systems['mindar-image-system'];
        
        await arSystem.start(); // This triggers the camera
        document.getElementById('shutter').style.opacity = '0';
    }

    // --- RELIABLE TARGET DETECTION ---
    document.addEventListener("DOMContentLoaded", () => {
        const sceneEl = document.querySelector('a-scene');

        // Listen for targetFound directly from the scene
        sceneEl.addEventListener("targetFound", (event) => {
            const index = event.detail.index;
            const station = stations[index];
            
            // UI Feedback
            document.getElementById('gps-status').innerText = "MATCH: " + station.name;
            document.getElementById('status-pulse').className = 'pulse match';
            document.getElementById(`card-${index}`).classList.add('found-glow');
            document.getElementById('match-sound').play();

            // Redirect
            setTimeout(() => {
                window.location.href = station.link;
            }, 1500);
        });

        sceneEl.addEventListener("targetLost", () => {
            document.getElementById('gps-status').innerText = "SCANNING...";
            document.getElementById('status-pulse').className = 'pulse live';
        });
    });
</script>
</body>
</html>
