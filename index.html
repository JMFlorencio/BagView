<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BAGVIEW | AR Eco-Tourism</title>
    
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        :root { 
            --accent: #00A699; 
            --scanning: #00A699; 
            --glass: rgba(255, 255, 255, 0.9); 
            --blur: blur(20px); 
            --bg-page: #F2F5F7;
            --text-main: #333333;
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #ffffff; font-family: 'Segoe UI', sans-serif; color: var(--text-main); }

        video { 
            position: fixed !important; 
            top: 0 !important; left: 0 !important; 
            width: 100vw !important; height: 100vh !important;
            object-fit: cover !important; 
            z-index: -5 !important; 
            display: block !important;
        }

        a-scene { background: none !important; background-color: transparent !important; }
        .a-canvas { background: transparent !important; }

        /* --- WELCOME PAGE --- */
        .overlay-screen { 
            position: fixed; inset: 0; z-index: 2000; 
            background: var(--bg-page); display: flex; 
            flex-direction: column; align-items: center; 
            justify-content: center; text-align: center; 
            transition: 0.8s ease; 
        }
        
        .main-card {
            width: 92%; height: 94%; background: white;
            border-radius: 35px; overflow: hidden;
            display: flex; flex-direction: column;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
        }

        .hero-container { position: relative; width: 100%; height: 60%; overflow: hidden; background: #eee; }
        
        .hero-scroll-wrapper {
            display: flex; width: 100%; height: 100%;
            overflow-x: auto; scroll-snap-type: x mandatory;
            scrollbar-width: none;
        }
        .hero-scroll-wrapper::-webkit-scrollbar { display: none; }

        .hero-slide { min-width: 100%; height: 100%; position: relative; scroll-snap-align: start; }
        .hero-img { width: 100%; height: 100%; background-size: cover; background-position: center; }

        .hero-info-overlay {
            position: absolute; bottom: 60px; left: 25px; right: 25px;
            text-align: left; color: white; z-index: 5;
        }
        .hero-info-overlay h2 { margin: 8px 0; font-size: 24px; font-weight: 800; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
        .hero-info-overlay p { margin: 0; font-size: 14px; opacity: 0.9; text-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        
        .badge {
            background: var(--accent); color: white;
            padding: 4px 10px; border-radius: 6px;
            font-size: 10px; font-weight: 800; text-transform: uppercase;
        }

        .hero-brush {
            position: absolute; bottom: -2px; left: 0; width: 100%; height: 100px;
            background: white; z-index: 2;
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 70%);
            mask-image: linear-gradient(to bottom, transparent, black 70%);
        }

        .scroll-dots {
            position: absolute; bottom: 25px; width: 100%;
            display: flex; justify-content: center; gap: 8px; z-index: 10;
        }
        .dot { width: 6px; height: 6px; background: rgba(0,0,0,0.15); border-radius: 50%; transition: 0.3s; }
        .dot.active { width: 20px; background: var(--accent); border-radius: 10px; }

        .hero-text-area { flex: 1; padding: 20px 30px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
        .hero-title { font-size: 22px; font-weight: 900; color: #111; line-height: 1.2; margin-top: 10px; }
        
        .get-started-btn {
            width: 100%; max-width: 280px; height: 60px;
            background: var(--accent); color: white;
            border: none; border-radius: 50px;
            font-size: 17px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; position: relative; padding-right: 45px;
            margin-bottom: 10px;
        }
        .btn-arrow-circle {
            position: absolute; right: 8px; width: 44px; height: 44px;
            background: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-arrow-circle svg { fill: var(--accent); width: 20px; }

        /* --- UI LAYER --- */
        #ui-layer { position: fixed; inset: 0; z-index: 100; pointer-events: none; transition: 0.5s; }
        .hidden { opacity: 0; pointer-events: none; visibility: hidden; }
        .top-nav { position: absolute; top: 0; left: 0; right: 0; padding: 30px 20px; display: flex; justify-content: space-between; align-items: center; }
        .back-btn-ui { width: 45px; height: 45px; background: var(--glass); backdrop-filter: var(--blur); border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; pointer-events: auto; }
        .gps-display { background: var(--glass); backdrop-filter: var(--blur); padding: 10px 18px; border-radius: 12px; display: flex; align-items: center; gap: 10px; }
        .pulse { width: 8px; height: 8px; background: #bbb; border-radius: 50%; } 
        .pulse.live { background: var(--scanning); animation: pulse-scanning 1.5s infinite; }
        .pulse.match { background: var(--accent); animation: pulse-match 0.5s infinite alternate; }

        .bottom-dock { 
            position: absolute; bottom: 0; width: 100vw; 
            transform: translateY(calc(100% - 40px)); 
            z-index: 120; padding-bottom: 120px; 
            transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1); 
            background: rgba(255, 255, 255, 0); 
            border-radius: 30px 30px 0 0;
            box-shadow: none;
        }
        .bottom-dock.expanded { 
            transform: translateY(0); 
            background: rgba(255, 255, 255, 1); 
            box-shadow: 0 -10px 30px rgba(0,0,0,0.1);
        }
        .drag-handle { 
            width: 100%; height: 50px; display: flex; 
            justify-content: center; align-items: center; 
            cursor: pointer; pointer-events: auto; 
        }
        .handle-bar { 
            width: 50px; height: 5px; 
            background: rgba(0, 0, 0, 0.3); 
            border-radius: 10px; transition: 0.3s; 
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
        }
        .scroll-container { 
            display: flex; gap: 12px; overflow-x: auto; 
            padding: 0 20px 20px 20px; width: 100%; 
            pointer-events: auto; 
            opacity: 0; 
            transition: opacity 0.3s ease;
            scroll-behavior: smooth;
        }
        .bottom-dock.expanded .scroll-container { opacity: 1; }
        
        .station-card { 
            min-width: 110px; height: 140px; background: #f9f9f9; 
            border-radius: 16px; overflow: hidden; border: 1px solid #eee; 
            flex-shrink: 0; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }
        .station-card:active { transform: scale(0.9); border-color: var(--accent); }
        .found-glow { 
            transform: scale(1.1) translateY(-10px); 
            border: 3px solid var(--accent) !important; 
            box-shadow: 0 10px 20px rgba(0, 166, 153, 0.3); 
            z-index: 10;
        }

        .nav-bar { 
            position: absolute; 
            bottom: 70px; 
            left: 0; right: 0; 
            display: flex; justify-content: center; align-items: center; gap: 25px; 
            z-index: 150; 
        }
        .icon-btn { width: 50px; height: 50px; border-radius: 50%; background: white; border: 1px solid #eee; display: flex; align-items: center; justify-content: center; cursor: pointer; pointer-events: auto; transition: 0.2s; }
        .cam-btn { width: 75px; height: 75px; border-radius: 50%; background: #ffffff; border: 4px solid #eee; display: flex; align-items: center; justify-content: center; cursor: pointer; pointer-events: auto; }
        .cam-btn.active { border-color: var(--accent); background: var(--accent); }

        #shutter { position: fixed; inset: 0; z-index: -1; background: #ffffff; transition: 0.8s; pointer-events: none; }
        @keyframes pulse-scanning { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(2.5); opacity: 0; } }
        @keyframes pulse-match { from { transform: scale(1); } to { transform: scale(1.3); } }
    </style>
</head>
<body>

    <audio id="match-sound" src="https://cdn.pixabay.com/audio/2021/08/04/audio_bb630cc098.mp3" preload="auto"></audio>

    <div id="home-page" class="overlay-screen">
        <div class="main-card">
            <div class="hero-container">
                <div class="hero-scroll-wrapper" id="hero-carousel">
                    <div class="hero-slide">
                        <div class="hero-img" style="background-image: url('Assets/A2_Main Entrance.png');"></div>
                        <div class="hero-info-overlay">
                            <span class="badge">Featured</span>
                            <h2>Botanical Garden</h2>
                            <p>Step into Baguio's vibrant floral heart.</p>
                        </div>
                    </div>
                    <div class="hero-slide">
                        <div class="hero-img" style="background-image: url('Assets/A1_Map.jpg');"></div>
                        <div class="hero-info-overlay">
                            <span class="badge">Interactive</span>
                            <h2>AR Navigation</h2>
                            <p>Unlock stories using your camera lens.</p>
                        </div>
                    </div>
                </div>
                <div class="scroll-dots">
                    <div class="dot active"></div>
                    <div class="dot"></div>
                </div>
                <div class="hero-brush"></div> 
            </div>
            <div class="hero-text-area">
                <h1 class="hero-title">Let’s Enjoy The<br>Beautiful World!</h1>
                <button class="get-started-btn" onclick="goToTutorial()">
                    Get Started
                    <div class="btn-arrow-circle">
                        <svg viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
                    </div>
                </button>
            </div>
        </div>
    </div>

    <div id="tutorial-page" class="overlay-screen hidden">
        <div style="width:85%; max-width:320px; height:480px; background:#f0f0f0; border-radius:24px; overflow:hidden;">
            <video id="tut-video" style="width:100%; height:100%; object-fit:cover;" playsinline muted loop>
                <source src="Assets/tutorial.mp4" type="video/mp4">
            </video>
        </div>
        <div style="margin-top:30px; padding:16px 40px; background:var(--accent); color:white; border-radius:50px; font-weight:800; cursor:pointer;" onclick="finishTutorial()">CONTINUE ➔</div>
    </div>

    <div id="ui-layer" class="hidden">
        <div class="top-nav">
            <div class="gps-display">
                <div class="pulse" id="status-pulse"></div>
                <div id="gps-status" style="font-size:11px; font-weight:900; color:#666;">SCANNING...</div>
            </div>
            <div class="back-btn-ui" onclick="goBackToHome()">
                <svg viewBox="0 0 24 24" width="24" fill="var(--accent)"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </div>
        </div>

        <div class="bottom-area">
            <div class="bottom-dock" id="gallery-hud">
                <div class="drag-handle" id="dock-trigger"><div class="handle-bar"></div></div>
                <div class="scroll-container" id="gallery-root"></div>
            </div>
            <div class="nav-bar">
                <div class="icon-btn"><svg viewBox="0 0 24 24" width="22" fill="#666"><path d="M21 6h-2v9H6v2c0 .55.45 1 1 1h11l4 4V7c0-.55-.45-1-1-1zm-4 6V3c0-.55-.45-1-1-1H3c-.55 0-1 .45-1 1v14l4-4h10c.55 0 1-.45 1-1z"/></svg></div>
                <div class="cam-btn" id="cam-toggle" onclick="toggleScanner()"><svg viewBox="0 0 24 24" width="32" fill="#999" id="cam-icon"><path d="M12 9c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3zm7-4h-2.69l-1.83-2H9.52l-1.83 2H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm-7 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg></div>
                <div class="icon-btn" onclick="switchCamera()">
                    <svg viewBox="0 0 24 24" width="24" fill="#666"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
                </div>
            </div>
        </div>
    </div>

    <div id="shutter"></div>

    <a-scene id="ar-scene" mindar-image="imageTargetSrc: targets.mind; autoStart: false; uiLoading: no; uiScanning: no; filterMinCF:0.0001; filterBeta: 0.001;" embedded renderer="transparent: true; alpha: true;" vr-mode-ui="enabled: false">
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity id="target-container"></a-entity>
    </a-scene>

<script>
  const stations = [
        { name: "Map", thumb: "Assets/A1_Map.jpg", link: "https://jmflorencio.github.io/BagView_Botanical_Map/" },
        { name: "Main Entrance", thumb: "Assets/A2_Main Entrance.png", link: "https://jmflorencio.github.io/BagView_Botanical_Map/" },
        { name: "Arbor", thumb: "Assets/Arbor.png", link: "https://tour.panoee.net/69b7b676cd5918466513b640" },
        { name: "Cactus & Succulents", thumb: "Assets/Cactus&Succulents.png", link: "https://tour.panoee.net/69b7b991cd59184ead13b71f" },
        { name: "Centennial Garden", thumb: "Assets/Centennial Garden.png", link: "https://tour.panoee.net/69b7b991cd59184ead13b71f" },
        { name: "Chinese Garden", thumb: "Assets/Chinese%20Garden.png", link: "https://tour.panoee.net/69b74a8ccd5918bff013a943" },
        { name: "Dahlia Garden", thumb: "Assets/Dahlia Garden.png", link: "https://tour.panoee.net/69b74a8ccd5918bff013a943" },
        { name: "Friendship Garden", thumb: "Assets/City%20of%20Vaughan%20Friendship%20Garden.png", link: "https://tour.panoee.net/69b7b820a3e4d78d0cc8db9e" },
        { name: "Cordillera Village", thumb: "Assets/Cordillera%20Village.png", link: "https://tour.panoee.net/69b7b964a3e4d75529c8dc1a" },
        { name: "Greenhouse", thumb: "Assets/Greenhouse.png", link: "https://tour.panoee.net/69b7b91fa3e4d7ebe6c8dbfe" },
        { name: "Japanese Garden", thumb: "Assets/Japanese%20Garden.png", link: "https://tour.panoee.net/69b7b63aa3e4d733edc8db51" },
        { name: "Japanese Tunnel", thumb: "Assets/Japanese%20Tunnel.png", link: "https://tour.panoee.net/69b7b616a3e4d72922c8db49" },
        { name: "Korea Garden", thumb: "Assets/Korea%20Garden.png", link: "https://tour.panoee.net/koreagarden/1" },
        { name: "Orchidarium", thumb: "Assets/Orchidarium.png", link: "https://tour.panoee.net/orchidarium/1" },
        { name: "Philippine-Thailand Friendship Garden", thumb: "Assets/Philippine-Thailand Frienship Garden.png", link: "https://tour.panoee.net/69b184dfa0e1d16f1a9e388d/69b187aba0e1d18afb9e38fb" },
        { name: "PMSEA Garden", thumb: "Assets/PMSEA%20Garden.png", link: "https://tour.panoee.net/69b7b586a3e4d741fdc8db26" }
    ];

    const hud = document.getElementById('gallery-hud');
    const trigger = document.getElementById('dock-trigger');

    // UI Logic
    trigger.addEventListener('click', () => hud.classList.toggle('expanded'));
    
    function buildUI() {
        const root = document.getElementById('gallery-root');
        root.innerHTML = stations.map((s, i) => `
            <div class="station-card" id="card-${i}" onclick="window.open('${s.link}', '_blank')">
                <div style="height:70%; background:#eee; overflow:hidden;">
                    <img src="${s.thumb}" style="width:100%; height:100%; object-fit:cover;" onerror="this.src='https://via.placeholder.com/150?text=No+Image'">
                </div>
                <div style="font-size:9px; text-align:center; padding:10px 5px; font-weight:bold; color:#444;">${s.name.toUpperCase()}</div>
            </div>
        `).join('');
    }

    // AR Scanner Controls
    async function toggleScanner() {
        const btn = document.getElementById('cam-toggle');
        const sceneEl = document.querySelector('a-scene');
        const camIcon = document.getElementById('cam-icon');
        const shutter = document.getElementById('shutter');
        
        if(!btn.classList.contains('active')) {
            try {
                await sceneEl.systems['mindar-image-system'].start();
                shutter.style.opacity = '0';
                shutter.style.zIndex = '-1';
                btn.classList.add('active');
                updateStatusUI('scanning');
                camIcon.setAttribute('fill', 'var(--accent)');
            } catch (err) {
                console.error("Scanner failed:", err);
            }
        } else {
            stopCamera();
        }
    }

    function stopCamera() {
        const sceneEl = document.querySelector('a-scene');
        const btn = document.getElementById('cam-toggle');
        const shutter = document.getElementById('shutter');
        if(sceneEl.systems['mindar-image-system']) sceneEl.systems['mindar-image-system'].stop();
        btn.classList.remove('active');
        updateStatusUI('standby');
        shutter.style.zIndex = '2500';
        shutter.style.opacity = '1';
    }

    function finishTutorial() {
        document.getElementById('tutorial-page').classList.add('hidden');
        document.getElementById('ui-layer').classList.remove('hidden');
        buildUI();
        setupARAnchors(); // Initialize anchors immediately
        toggleScanner();
    }

    function setupARAnchors() {
        const container = document.getElementById('target-container');
        container.innerHTML = ''; // Clear existing

        stations.forEach((station, index) => {
            const entity = document.createElement('a-entity');
            entity.setAttribute('mindar-image-target', `targetIndex: ${index}`);
            
            // Explicitly add a tracking plane
            const plane = document.createElement('a-plane');
            plane.setAttribute('geometry', 'primitive: plane; width: 1; height: 1');
            plane.setAttribute('material', 'transparent: true; opacity: 0');
            entity.appendChild(plane);

            // Attach listeners directly to the entity
            entity.addEventListener("targetFound", () => {
                updateStatusUI('match');
                const sound = document.getElementById('match-sound');
                if(sound) { sound.currentTime = 0; sound.play(); }

                const card = document.getElementById(`card-${index}`);
                if(card) {
                    card.classList.add('found-glow');
                    card.scrollIntoView({ behavior: 'smooth', inline: 'center' });
                    hud.classList.add('expanded');
                }

                setTimeout(() => {
                    window.open(station.link, '_blank');
                    setTimeout(() => card?.classList.remove('found-glow'), 3000);
                }, 1500);
            });

            entity.addEventListener("targetLost", () => {
                updateStatusUI('scanning');
            });

            container.appendChild(entity);
        });
    }

    function updateStatusUI(type) {
        const pulse = document.getElementById('status-pulse');
        const text = document.getElementById('gps-status');
        if(!pulse || !text) return;
        
        pulse.className = 'pulse';
        if (type === 'scanning') { pulse.classList.add('live'); text.innerText = "SCANNING..."; }
        else if (type === 'match') { pulse.classList.add('match'); text.innerText = "MATCH FOUND!"; }
        else { text.innerText = "STANDBY"; }
    }

    // Helper functions for navigation
    function goToTutorial() {
        document.getElementById('home-page').classList.add('hidden');
        document.getElementById('tutorial-page').classList.remove('hidden');
        document.getElementById('tut-video').play();
    }

    function goBackToHome() {
        stopCamera();
        document.getElementById('ui-layer').classList.add('hidden');
        document.getElementById('home-page').classList.remove('hidden');
    }
</script>
</body>
</html>
