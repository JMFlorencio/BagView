<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BAGVIEW | AR Eco-Tourism</title>
    
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        :root { 
            --accent: #00A699; 
            --scanning: #00A699; 
            --glass: rgba(255, 255, 255, 0.9); 
            --blur: blur(20px); 
            --bg-page: #F2F5F7;
            --text-main: #333333;
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #ffffff; font-family: 'Segoe UI', sans-serif; color: var(--text-main); }

        /* CRITICAL: Keep camera feed behind UI */
        video { 
            position: fixed !important; 
            top: 0 !important; left: 0 !important; 
            width: 100vw !important; height: 100vh !important;
            object-fit: cover !important; 
            z-index: -5 !important; 
            display: block !important;
        }

        a-scene { background: none !important; background-color: transparent !important; }
        .a-canvas { background: transparent !important; }

        /* --- WELCOME PAGE --- */
        .overlay-screen { 
            position: fixed; inset: 0; z-index: 2000; 
            background: var(--bg-page); display: flex; 
            flex-direction: column; align-items: center; 
            justify-content: center; text-align: center; 
            transition: 0.8s ease; 
        }
        
        .main-card {
            width: 92%; height: 94%; background: white;
            border-radius: 35px; overflow: hidden;
            display: flex; flex-direction: column;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
        }

        .hero-container { position: relative; width: 100%; height: 60%; overflow: hidden; background: #eee; }
        .hero-scroll-wrapper { display: flex; width: 100%; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
        .hero-scroll-wrapper::-webkit-scrollbar { display: none; }
        .hero-slide { min-width: 100%; height: 100%; position: relative; scroll-snap-align: start; }
        .hero-img { width: 100%; height: 100%; background-size: cover; background-position: center; }

        .hero-info-overlay { position: absolute; bottom: 60px; left: 25px; right: 25px; text-align: left; color: white; z-index: 5; }
        .hero-info-overlay h2 { margin: 8px 0; font-size: 24px; font-weight: 800; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
        .hero-info-overlay p { margin: 0; font-size: 14px; opacity: 0.9; text-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        
        .badge { background: var(--accent); color: white; padding: 4px 10px; border-radius: 6px; font-size: 10px; font-weight: 800; text-transform: uppercase; }
        .hero-brush { position: absolute; bottom: -2px; left: 0; width: 100%; height: 100px; background: white; z-index: 2; -webkit-mask-image: linear-gradient(to bottom, transparent, black 70%); mask-image: linear-gradient(to bottom, transparent, black 70%); }

        .scroll-dots { position: absolute; bottom: 25px; width: 100%; display: flex; justify-content: center; gap: 8px; z-index: 10; }
        .dot { width: 6px; height: 6px; background: rgba(0,0,0,0.15); border-radius: 50%; transition: 0.3s; }
        .dot.active { width: 20px; background: var(--accent); border-radius: 10px; }

        .hero-text-area { flex: 1; padding: 20px 30px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
        .hero-title { font-size: 22px; font-weight: 900; color: #111; line-height: 1.2; margin-top: 10px; }
        
        .get-started-btn {
            width: 100%; max-width: 280px; height: 60px;
            background: var(--accent); color: white;
            border: none; border-radius: 50px;
            font-size: 17px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; position: relative; padding-right: 45px;
            margin-bottom: 10px;
        }
        .btn-arrow-circle { position: absolute; right: 8px; width: 44px; height: 44px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .btn-arrow-circle svg { fill: var(--accent); width: 20px; }

        /* --- UI LAYER --- */
        #ui-layer { position: fixed; inset: 0; z-index: 100; pointer-events: none; transition: 0.5s; }
        .hidden { opacity: 0 !important; pointer-events: none !important; visibility: hidden !important; }
        .top-nav { position: absolute; top: 0; left: 0; right: 0; padding: 30px 20px; display: flex; justify-content: space-between; align-items: center; }
        .back-btn-ui { width: 45px; height: 45px; background: var(--glass); backdrop-filter: var(--blur); border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; pointer-events: auto; }
        .gps-display { background: var(--glass); backdrop-filter: var(--blur); padding: 10px 18px; border-radius: 12px; display: flex; align-items: center; gap: 10px; }
        .pulse { width: 8px; height: 8px; background: #bbb; border-radius: 50%; } 
        .pulse.live { background: var(--scanning); animation: pulse-scanning 1.5s infinite; }
        .pulse.match { background: #FFC107; animation: pulse-match 0.5s infinite alternate; }

        .bottom-dock { 
            position: absolute; bottom: 0; width: 100vw; 
            transform: translateY(calc(100% - 60px)); 
            z-index: 120; padding-bottom: 100px; 
            transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1); 
            background: white; 
            border-radius: 30px 30px 0 0;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
        }
        .bottom-dock.expanded { transform: translateY(0); }
        .drag-handle { width: 100%; height: 60px; display: flex; justify-content: center; align-items: center; cursor: pointer; pointer-events: auto; }
        .handle-bar { width: 40px; height: 4px; background: #ddd; border-radius: 10px; }
        
        .scroll-container { display: flex; gap: 12px; overflow-x: auto; padding: 0 20px 40px 20px; width: 100%; pointer-events: auto; scroll-behavior: smooth; scrollbar-width: none;}
        .scroll-container::-webkit-scrollbar { display: none; }
        
        .station-card { min-width: 120px; height: 150px; background: #fff; border-radius: 18px; overflow: hidden; border: 1px solid #eee; flex-shrink: 0; transition: 0.3s; }
        .station-card.found-glow { border: 2px solid var(--accent); box-shadow: 0 0 15px var(--accent); transform: scale(1.05); }

        .nav-bar { position: fixed; bottom: 30px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 20px; z-index: 150; }
        .icon-btn { width: 55px; height: 55px; border-radius: 50%; background: white; border: 1px solid #eee; display: flex; align-items: center; justify-content: center; cursor: pointer; pointer-events: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .cam-btn { width: 70px; height: 70px; border-radius: 50%; background: #ffffff; border: 4px solid #eee; display: flex; align-items: center; justify-content: center; cursor: pointer; pointer-events: auto; }
        .cam-btn.active { border-color: var(--accent); background: var(--accent); }

        #shutter { position: fixed; inset: 0; z-index: 2500; background: #ffffff; transition: 0.5s; pointer-events: none; opacity: 1; }
        
        @keyframes pulse-scanning { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(3); } }
        @keyframes pulse-match { from { transform: scale(1); } to { transform: scale(1.4); } }
    </style>
</head>
<body>

    <audio id="match-sound" src="https://cdn.pixabay.com/audio/2021/08/04/audio_bb630cc098.mp3" preload="auto"></audio>

    <div id="home-page" class="overlay-screen">
        <div class="main-card">
            <div class="hero-container">
                <div class="hero-scroll-wrapper" id="hero-carousel">
                    <div class="hero-slide">
                        <div class="hero-img" style="background-image: url('Assets/A2_Main Entrance.png');"></div>
                        <div class="hero-info-overlay">
                            <span class="badge">Featured</span>
                            <h2>Botanical Garden</h2>
                            <p>Step into Baguio's vibrant floral heart.</p>
                        </div>
                    </div>
                    <div class="hero-slide">
                        <div class="hero-img" style="background-image: url('Assets/A1_Map.jpg');"></div>
                        <div class="hero-info-overlay">
                            <span class="badge">Interactive</span>
                            <h2>AR Navigation</h2>
                            <p>Unlock stories using your camera lens.</p>
                        </div>
                    </div>
                </div>
                <div class="scroll-dots">
                    <div class="dot active"></div>
                    <div class="dot"></div>
                </div>
                <div class="hero-brush"></div> 
            </div>
            <div class="hero-text-area">
                <h1 class="hero-title">Explore Baguio<br>in Augmented Reality</h1>
                <button class="get-started-btn" onclick="goToTutorial()">
                    Get Started
                    <div class="btn-arrow-circle">
                        <svg viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
                    </div>
                </button>
            </div>
        </div>
    </div>

    <div id="tutorial-page" class="overlay-screen hidden">
        <div style="width:85%; max-width:320px; height:480px; background:#000; border-radius:24px; overflow:hidden; position:relative;">
            <video id="tut-video" style="width:100%; height:100%; object-fit:cover;" playsinline muted loop>
                <source src="Assets/tutorial.mp4" type="video/mp4">
            </video>
        </div>
        <div style="margin-top:30px; padding:16px 40px; background:var(--accent); color:white; border-radius:50px; font-weight:800; cursor:pointer;" onclick="finishTutorial()">CONTINUE ➔</div>
    </div>

    <div id="ui-layer" class="hidden">
        <div class="top-nav">
            <div class="gps-display">
                <div class="pulse" id="status-pulse"></div>
                <div id="gps-status" style="font-size:11px; font-weight:900; color:#666;">SCANNING...</div>
            </div>
            <div class="back-btn-ui" onclick="goBackToHome()">
                <svg viewBox="0 0 24 24" width="24" fill="var(--accent)"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </div>
        </div>

        <div class="bottom-dock" id="gallery-hud">
            <div class="drag-handle" id="dock-trigger"><div class="handle-bar"></div></div>
            <div class="scroll-container" id="gallery-root"></div>
        </div>

        <div class="nav-bar">
            <div class="icon-btn"><svg viewBox="0 0 24 24" width="22" fill="#666"><path d="M21 6h-2v9H6v2c0 .55.45 1 1 1h11l4 4V7c0-.55-.45-1-1-1zm-4 6V3c0-.55-.45-1-1-1H3c-.55 0-1 .45-1 1v14l4-4h10c.55 0 1-.45 1-1z"/></svg></div>
            <div class="cam-btn active" id="cam-toggle" onclick="toggleScanner()"><svg viewBox="0 0 24 24" width="32" fill="#fff" id="cam-icon"><path d="M12 9c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.66 3-3-1.34-3-3-3zm7-4h-2.69l-1.83-2H9.52l-1.83 2H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm-7 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg></div>
            <div class="icon-btn" onclick="location.reload()">
                <svg viewBox="0 0 24 24" width="24" fill="#666"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
            </div>
        </div>
    </div>

    <div id="shutter"></div>

    <a-scene id="ar-scene" mindar-image="imageTargetSrc: targets.mind; autoStart: false; uiLoading: no; uiScanning: no;" embedded renderer="transparent: true; alpha: true;" vr-mode-ui="enabled: false">
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity id="target-container"></a-entity>
    </a-scene>

<script>
    const stations = [
        { name: "Map", thumb: "Assets/A1_Map.jpg", link: "https://jmflorencio.github.io/BagView_Botanical_Map/" },
        { name: "Main Entrance", thumb: "Assets/A2_Main Entrance.png", link: "https://jmflorencio.github.io/BagView_Botanical_Map/" },
        { name: "Arbor", thumb: "Assets/Arbor.png", link: "https://tour.panoee.net/69b7b676cd5918466513b640" },
        { name: "Cactus & Succulents", thumb: "Assets/Cactus&Succulents.png", link: "https://tour.panoee.net/69b7b991cd59184ead13b71f" },
        { name: "Chinese Garden", thumb: "Assets/Chinese Garden.png", link: "https://tour.panoee.net/69b74a8ccd5918bff013a943" },
        { name: "Friendship Garden", thumb: "Assets/City of Vaughan Friendship Garden.png", link: "https://tour.panoee.net/69b7b820a3e4d78d0cc8db9e" },
        { name: "Cordillera Village", thumb: "Assets/Cordillera Village.png", link: "https://tour.panoee.net/69b7b964a3e4d75529c8dc1a" },
        { name: "Greenhouse", thumb: "Assets/Greenhouse.png", link: "https://tour.panoee.net/69b7b91fa3e4d7ebe6c8dbfe" },
        { name: "Japanese Garden", thumb: "Assets/Japanese Garden.png", link: "https://tour.panoee.net/69b7b63aa3e4d733edc8db51" },
        { name: "Japanese Tunnel", thumb: "Assets/Japanese Tunnel.png", link: "https://tour.panoee.net/69b7b616a3e4d72922c8db49" },
        { name: "Korea Garden", thumb: "Assets/Korea Garden.png", link: "https://tour.panoee.net/koreagarden/1" },
        { name: "Orchidarium", thumb: "Assets/Orchidarium.png", link: "https://tour.panoee.net/orchidarium/1" },
        { name: "PMSEA Garden", thumb: "Assets/PMSEA Garden.png", link: "https://tour.panoee.net/69b7b586a3e4d741fdc8db26" }
    ];

    const shutter = document.getElementById('shutter');
    const hud = document.getElementById('gallery-hud');
    const trigger = document.getElementById('dock-trigger');

    window.addEventListener('load', () => {
        setTimeout(() => { shutter.style.opacity = '0'; }, 500);
    });

    trigger.addEventListener('click', () => hud.classList.toggle('expanded'));

    function buildUI() {
        const root = document.getElementById('gallery-root');
        root.innerHTML = stations.map((s, i) => `
            <div class="station-card" id="card-${i}" onclick="window.open('${s.link}', '_blank')">
                <div style="height:70%; background:#f0f0f0; overflow:hidden;">
                    <img src="${s.thumb}" style="width:100%; height:100%; object-fit:cover;" onerror="this.src='https://via.placeholder.com/150?text=Scan+Me'">
                </div>
                <div style="font-size:9px; text-align:center; padding:8px 4px; font-weight:bold; color:#444;">${s.name.toUpperCase()}</div>
            </div>
        `).join('');
    }

    function goToTutorial() {
        document.getElementById('home-page').classList.add('hidden');
        document.getElementById('tutorial-page').classList.remove('hidden');
        document.getElementById('tut-video').play();
    }

    function finishTutorial() {
        document.getElementById('tutorial-page').classList.add('hidden');
        document.getElementById('ui-layer').classList.remove('hidden');
        buildUI();
        initARAnchors();
        startAR();
    }

    function initARAnchors() {
        const container = document.getElementById('target-container');
        container.innerHTML = ''; 
        stations.forEach((s, index) => {
            const entity = document.createElement('a-entity');
            entity.setAttribute('mindar-image-target', `targetIndex: ${index}`);
            
            entity.addEventListener("targetFound", () => {
                updateStatusUI('match');
                document.getElementById('match-sound').play();
                hud.classList.add('expanded');
                
                const card = document.getElementById(`card-${index}`);
                if(card) {
                    card.classList.add('found-glow');
                    card.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                    setTimeout(() => {
                        window.open(s.link, '_blank');
                    }, 1500);
                }
            });

            entity.addEventListener("targetLost", () => {
                updateStatusUI('scanning');
                const card = document.getElementById(`card-${index}`);
                if(card) card.classList.remove('found-glow');
            });

            container.appendChild(entity);
        });
    }

    async function startAR() {
        const sceneEl = document.querySelector('a-scene');
        const system = sceneEl.systems['mindar-image-system'];
        shutter.style.opacity = '1';
        try {
            await system.start();
            document.body.style.backgroundColor = "transparent";
            updateStatusUI('scanning');
        } catch (e) { console.error(e); }
        shutter.style.opacity = '0';
    }

    function toggleScanner() {
        const btn = document.getElementById('cam-toggle');
        const sceneEl = document.querySelector('a-scene');
        const system = sceneEl.systems['mindar-image-system'];
        
        if(btn.classList.contains('active')) {
            system.stop();
            btn.classList.remove('active');
            updateStatusUI('standby');
            document.body.style.backgroundColor = "#ffffff";
            shutter.style.opacity = '1';
        } else {
            system.start();
            btn.classList.add('active');
            updateStatusUI('scanning');
            document.body.style.backgroundColor = "transparent";
            shutter.style.opacity = '0';
        }
    }

    function updateStatusUI(type) {
        const pulse = document.getElementById('status-pulse');
        const text = document.getElementById('gps-status');
        pulse.className = 'pulse';
        if (type === 'scanning') { pulse.classList.add('live'); text.innerText = "SCANNING..."; }
        else if (type === 'match') { pulse.classList.add('match'); text.innerText = "MATCH FOUND!"; }
        else { text.innerText = "CAMERA OFF"; }
    }

    function goBackToHome() { location.reload(); }
</script>
</body>
</html>
